[project]
name = "fluentpal-voice-tutor-backend"
version = "0.1.0"
description = "FluentPal Voice Tutor backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
dev-dependencies = ["pytest>=8.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
